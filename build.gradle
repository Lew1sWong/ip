plugins {
    id 'java'
    id 'application'
    id 'checkstyle'
    id 'com.gradleup.shadow' version '9.5.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

checkstyle {
    // The rules themselves live in config/checkstyle/checkstyle.xml, which is the
    // sample configuration for the SE-EDU coding standard. Only the version of the
    // tool that reads them is pinned here, so a Gradle upgrade cannot quietly
    // change which violations are reported.
    toolVersion = '11.0.0'
}

repositories {
    mavenCentral()
}

dependencies {
    String jUnitVersion = '5.14.4'

    testImplementation "org.junit.jupiter:junit-jupiter-api:${jUnitVersion}"

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jUnitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
}

test {
    useJUnitPlatform()

    testLogging {
        events 'passed', 'skipped', 'failed'

        showExceptions = true
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
        showStandardStreams = false
    }
}

javadoc {
    // Turn on every doclint check. A missing @param or a {@link} pointing at
    // nothing is a documentation bug, and the cheapest time to fix one is while
    // the code it describes is still fresh.
    options.addStringOption('Xdoclint:all', '-quiet')
}

application {
    mainClass = 'chione.Chione'
}

jar {
    // A lean JAR file (i.e., without the dependencies packaged inside) is not needed.
    enabled = false
    // Rename its output anyway; Gradle forbids it clashing with the shadowJar output file, even for a disabled task.
    archiveClassifier = 'without-dependencies'
}

shadowJar {
    archiveFileName = 'chione.jar'
}

run {
    standardInput = System.in
}
